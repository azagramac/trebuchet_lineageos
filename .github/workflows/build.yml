name: 🔨 Build Trebuchet (Debug)

on:
  push:
    branches: [main, master, develop, lineage-22.2]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: 🤖 Build Trebuchet APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Checkout LineageOS SystemUI shared libraries
        run: |
          git clone --depth 1 -b lineage-22.2 \
            https://github.com/LineageOS/android_frameworks_libs_systemui.git \
            systemui-libs

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK (API 36 - Android 16)
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Prepare Signing Keystore
        env:
          KEYSTORE_DEBUG_B64: ${{ secrets.ANDROID_KEYSTORE_DEBUG_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          B64="${KEYSTORE_DEBUG_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -z "$B64" ]; then
            echo "::error::❌ Missing ANDROID_KEYSTORE_DEBUG_BASE64 (or KEYSTORE_BASE64) secret in GitHub Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::❌ Missing KEYSTORE_PASSWORD secret in GitHub Secrets."
            exit 1
          fi
          JKS="$RUNNER_TEMP/debug.jks"
          echo "$B64" | base64 -d > "$JKS"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
            [ -n "$DETECTED_ALIAS" ] && echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
          fi
          echo "✅ Signing keystore loaded from GitHub Secrets."

      - name: 🛠️ Build Trebuchet Debug APK
        run: gradle assembleTrebuchetDebug -PversionCode="${{ github.run_number }}" --stacktrace

      - name: 📊 Generate Build Summary
        if: always()
        run: |
          APK_FILE=$(find build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          APK_NAME=$([ -n "$APK_FILE" ] && basename "$APK_FILE" || echo "N/A")
          APK_SIZE=$([ -n "$APK_FILE" ] && du -h "$APK_FILE" | cut -f1 || echo "N/A")
          APK_SHA256=$([ -n "$APK_FILE" ] && sha256sum "$APK_FILE" | cut -d' ' -f1 || echo "N/A")

          {
            echo "### 🤖 Trebuchet LineageOS Build Summary"
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| 📦 **Artifact** | \`$APK_NAME\` |"
            echo "| 🎯 **Target SDK** | \`36 (Android 16)\` |"
            echo "| 📏 **Size** | \`$APK_SIZE\` |"
            echo "| 🔢 **Version Code** | \`${{ github.run_number }}\` |"
            echo "| 🔑 **Signing** | 🔐 Keystore (\`ANDROID_KEYSTORE_DEBUG_BASE64\`) |"
            echo "| 🔒 **SHA-256** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Clean up Keystore from Runner
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.jks"

      - name: 📦 Upload Trebuchet APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: trebuchet-lineageos-debug
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
