name: 🚀 Release Trebuchet APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 16.0.0)"
        required: false
        default: "16.0.0"

permissions:
  contents: write

jobs:
  release-apk:
    name: 📦 Build & Publish Release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Checkout LineageOS SystemUI shared libraries
        run: |
          git clone --depth 1 -b lineage-22.2 \
            https://github.com/LineageOS/android_frameworks_libs_systemui.git \
            systemui-libs

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK (API 36 - Android 16)
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 🐘 Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14

      - name: 🔐 Prepare Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FALLBACK_B64: ${{ secrets.ANDROID_KEYSTORE_DEBUG_BASE64 }}
        run: |
          B64="${KEYSTORE_B64:-$KEYSTORE_FALLBACK_B64}"
          if [ -z "$B64" ]; then
            echo "::error::❌ Missing KEYSTORE_BASE64 secret in GitHub Secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::❌ Missing KEYSTORE_PASSWORD secret in GitHub Secrets."
            exit 1
          fi
          JKS="$RUNNER_TEMP/release.jks"
          echo "$B64" | base64 -d > "$JKS"
          echo "KEYSTORE_FILE=$JKS" >> "$GITHUB_ENV"
          if [ -z "$KEY_ALIAS" ] || ! keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n1 | cut -d',' -f1)
            [ -n "$DETECTED_ALIAS" ] && echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
          fi
          echo "✅ Release keystore loaded from GitHub Secrets."

      - name: 🛠️ Build Trebuchet Release APK
        run: |
          RAW_TAG="${GITHUB_REF_NAME#v}"
          VERSION_NAME="${{ inputs.version_name || '' }}"
          if [ -z "$VERSION_NAME" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION_NAME="$RAW_TAG"
            else
              VERSION_NAME="16.0.0"
            fi
          fi
          gradle assembleTrebuchetRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}" \
            --stacktrace

      - name: 🧹 Clean up Keystore from Runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: 📦 Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: trebuchet-lineageos-release
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
